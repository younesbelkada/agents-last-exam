# Budget split on Qwen3.8-27B: one agent with B vs N sub-agents with B/N.
#
#     uv run python -m ale_run run budget_exp_qwen.yaml --dry-run
#     uv run python -m ale_run run budget_exp_qwen.yaml -v
#
# Read docs/budget-split-experiment.md before interpreting anything; the
# stop_reason breakdown decides which runs are evidence about budgets at all.
#
# tasks: start small. Every unit boots its own sandbox (~30 min cold image
# pull), and both arms run over every task listed here.

name: budget_split_qwen

secret_file: secret/.env

agents:
  - configs/agents/claw_budget_qwen_single.yaml
  - configs/agents/claw_budget_qwen_split.yaml
environment: configs/environments/hfsandbox_budget.yaml

tasks: selected_tasks/budget_subset.txt

output:
  root: .logs/ale

concurrency: 1
wall_time_s: 7200
auto_resume: true
max_attempts: 1
cleanup_mode: delete
