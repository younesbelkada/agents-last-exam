[project]
name = "ale-claw-budget"
version = "0.1.0"
description = "Token-budgeted ale_claw variant for the budget-split experiment."
requires-python = ">=3.12,<3.14"
dependencies = [
    # Reuses the ale_claw harness in-tree, so it needs the same stack. Pinned
    # together with ale_claw's own pyproject; bump both at once.
    "cua-agent==0.7.38",
    "cua-computer==0.5.17",
    "cua-core==0.1.18",
    "litellm>=1.80",
    "Pillow>=10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Marker only: the code ships in the parent `agent-last-exam` wheel. This
# member exists so uv installs the dependencies.
only-include = []
sources = {}
bypass-selection = true
