# Local debug run of the budget-split experiment: one task, local container.
#
#     uv run python -m ale_run run budget_exp_qwen_local.yaml --dry-run
#     uv run python -m ale_run run budget_exp_qwen_local.yaml \
#       --agent claw_budget_qwen_single --disable-resume -v
#
# Clinical_Variant_Annotation on purpose: its grader needs no reference data,
# so a staging mistake cannot be mistaken for a budget bug.

name: budget_split_qwen_local

secret_file: secret/.env

agents:
  - configs/agents/claw_budget_qwen_single.yaml
  - configs/agents/claw_budget_qwen_split.yaml
environment: configs/environments/docker_budget_debug.yaml

tasks:
  - path: health_medicine/Clinical_Variant_Annotation
    variants: [0]

output:
  root: .logs/ale-debug

concurrency: 1
# Short on purpose: a debug run should fail fast, not burn an hour.
wall_time_s: 1800
auto_resume: false
max_attempts: 1
cleanup_mode: delete
